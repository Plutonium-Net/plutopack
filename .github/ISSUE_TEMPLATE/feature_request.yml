name: Feature Request
description: Suggest an idea or new feature for PlutoPack
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for PlutoPack? Let us know what you'd like to see!

  - type: textarea
    id: feature-description
    attributes:
      label: Proposed Feature
      description: Is your feature request related to a problem or a new idea? Describe it clearly.
      placeholder: e.g., Add support for auto-updating configurations...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or mockups about the feature request here.
    validations:
      required: false
